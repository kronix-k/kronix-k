<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" role="img" aria-label="kronix-k - Low-level systems, interactive UIs, and constant learning." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>kronix-k - Low-level systems, interactive UIs, and constant learning.</title>
<style>

text{font-family:'Zen Kaku Gothic New','Segoe UI',Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;}
.disp{font-family:'Dela Gothic One','Arial Black','Impact','Segoe UI',sans-serif;font-weight:400;}
.L{font-size:138px;transform-box:fill-box;transform-origin:center;animation:drop .8s cubic-bezier(.2,.9,.3,1.3) both,wave 3s ease-in-out infinite;animation-delay:calc(var(--i)*80ms),calc(1s + var(--i)*140ms);}@keyframes drop{from{transform:translateY(-1.2em) rotate(-25deg) scale(.4);opacity:0;}}@keyframes wave{0%,100%{transform:translateY(0);}50%{transform:translateY(-.08em);}}.fu{animation:fadeUp .7s ease 1.3s both;}@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<rect width="900" height="488" fill="#DCD5F2"/>
<g transform="rotate(-3 44 205)"><text class="L disp" style="--i:0" x="89.5" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">k</text><text class="L disp" style="--i:1" x="175.1" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">r</text><text class="L disp" style="--i:2" x="262.0" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">o</text><text class="L disp" style="--i:3" x="354.5" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">n</text><text class="L disp" style="--i:4" x="424.9" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">i</text><text class="L disp" style="--i:5" x="495.3" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">x</text><text class="L disp" style="--i:6" x="569.8" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">-</text><text class="L disp" style="--i:7" x="644.3" y="175" text-anchor="middle" fill="#D81B6A" aria-hidden="true">k</text></g><clipPath id="wipe"><rect x="44" y="232" width="0" height="80"><animate attributeName="width" from="0" to="359" begin="1s" dur=".7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".7 0 .2 1"/></rect></clipPath><g clip-path="url(#wipe)"><rect x="44" y="232" width="359" height="80" fill="#F6D743"/><text x="64" y="266" font-size="19" font-weight="700" fill="#1E1433">Low-level systems, interactive</text><text x="64" y="296" font-size="19" font-weight="700" fill="#1E1433">UIs, and constant learning.</text></g><g class="fu"><text x="44" y="356" font-size="17" font-weight="400" fill="#4D4366">I build small tools and one big voice assistant, mostly</text><text x="44" y="384" font-size="17" font-weight="400" fill="#4D4366">in the gaps between games and anime. Below: what I’m</text><text x="44" y="412" font-size="17" font-weight="400" fill="#4D4366">making, what I use, and what I’ve been playing and</text><text x="44" y="440" font-size="17" font-weight="400" fill="#4D4366">watching.</text></g>
</svg>
