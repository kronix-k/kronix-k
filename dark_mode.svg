<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="985" height="580" viewBox="0 0 985 580" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Roboto+Mono:wght@500&amp;display=swap');
        .d-title { font: bold 32px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #E6E1E5; }
        .d-subtitle { font: 500 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #D0BCFF; }
        .d-body-text { font: 400 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #CAC4D0; }
        .d-label { font: bold 12px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #938F99; text-transform: uppercase; letter-spacing: 1px; }
        .d-mono { font: 500 14px 'Roboto Mono', 'Courier New', monospace; fill: #E6E1E5; }
        .d-stat-value { font: bold 64px 'Roboto Mono', 'Courier New', monospace; fill: #EADDFF; }
        .d-streak-value { font: bold 48px 'Roboto Mono', 'Courier New', monospace; fill: #BFCBAD; }
        .d-chip-bg { fill: #49454F; stroke: #938F99; stroke-width: 1; }
        .d-chip-bg-ide { fill: #4F378B; stroke: #938F99; stroke-width: 1; }
        .d-chip-text { font: 500 12px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #CAC4D0; }
        .d-add-color { fill: #81C784; }
        .d-del-color { fill: #E57373; }
    </style>

    <!-- Background -->
    <rect width="985" height="580" rx="28" fill="#1C1B1F"/>

    <!-- Header Card -->
    <rect x="24" y="24" width="450" height="180" rx="24" fill="#332F37"/>
    <circle cx="72" cy="72" r="32" fill="#D0BCFF"/>
    <text x="72" y="81" text-anchor="middle" style="font: bold 24px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #381E72;">KK</text>

    <text x="120" y="65" class="d-title">kronix-k</text>
    <text x="120" y="90" class="d-subtitle">Low-level systems &#183; Interactive UIs</text>
    <text x="50" y="135" class="d-body-text">Passionate about constant learning</text>

    <!-- Tool Chips -->
    <g transform="translate(50, 160)">
        <rect width="76" height="26" rx="8" class="d-chip-bg"/>
        <text x="12" y="17" class="d-chip-text">Android</text>
        <rect x="86" width="64" height="26" rx="8" class="d-chip-bg"/>
        <text x="98" y="17" class="d-chip-text">Kotlin</text>
        <rect x="160" width="54" height="26" rx="8" class="d-chip-bg"/>
        <text x="172" y="17" class="d-chip-text">Rust</text>
        <rect x="224" width="44" height="26" rx="8" class="d-chip-bg"/>
        <text x="236" y="17" class="d-chip-text">Go</text>
        <rect x="278" width="72" height="26" rx="8" class="d-chip-bg-ide"/>
        <text x="290" y="17" class="d-chip-text">Python</text>
    </g>

    <!-- Streak Card -->
    <rect x="494" y="24" width="220" height="180" rx="24" fill="#2D332B" stroke="#444C3E" stroke-width="1"/>
    <text x="518" y="55" class="d-label" fill="#BFCBAD">Current Streak</text>
    <text x="518" y="140" id="streak_data" class="d-streak-value">27</text>
    <text x="518" y="170" class="d-body-text" fill="#BFCBAD" style="font-size: 12px; fill: #BFCBAD;">Consecutive Days</text>

    <!-- Stars Card -->
    <rect x="734" y="24" width="227" height="180" rx="24" fill="#4F378B"/>
    <text x="754" y="55" class="d-label" style="fill: #EADDFF; fill-opacity: 0.7;">Stars Earned</text>
    <text x="754" y="140" id="star_data" class="d-stat-value" style="font-size: 54px;">4</text>
    <text x="754" y="170" class="d-body-text" style="font-size: 12px; fill: #EADDFF;">Across all repos</text>

    <!-- Tech Stack Card -->
    <rect x="24" y="224" width="550" height="260" rx="24" stroke="#938F99" stroke-width="1"/>
    <text x="48" y="265" class="d-subtitle" style="font-size: 18px;">Tech Stack</text>

    <text x="48" y="295" class="d-label">Programming</text>
    <text x="48" y="315" class="d-body-text" style="fill: #E6E1E5;">Kotlin, Python, Rust, Go</text>

    <text x="48" y="355" class="d-label">Platforms &amp; Web</text>
    <text x="48" y="375" class="d-body-text" style="fill: #E6E1E5;">Android, Node.js, HTML5, CSS3</text>

    <text x="48" y="415" class="d-label">Currently Working On</text>
    <text x="48" y="435" class="d-body-text" style="fill: #E6E1E5;">Neo Assistant, CLI Calculator, Temp Converter, Warranty Manager</text>

    <!-- Git Metrics Cards -->
    <rect x="594" y="224" width="177" height="100" rx="24" fill="#332F37"/>
    <text x="682" y="270" text-anchor="middle" id="repo_data" class="d-mono" style="font-size: 22px; font-weight: bold;">9</text>
    <text x="682" y="295" text-anchor="middle" class="d-label">Repos</text>

    <rect x="784" y="224" width="177" height="100" rx="24" fill="#332F37"/>
    <text x="872" y="270" text-anchor="middle" id="contrib_data" class="d-mono" style="font-size: 22px; font-weight: bold; fill: #EFB8C8;">118</text>
    <text x="872" y="295" text-anchor="middle" class="d-label">Contribs</text>

    <!-- LOC Card -->
    <rect x="594" y="344" width="367" height="140" rx="24" fill="#332F37"/>
    <text x="618" y="390" class="d-label">Total Lines of Code</text>
    <text x="943" y="390" text-anchor="end" id="loc_data" class="d-mono" style="font-size: 20px;">2,505,207</text>

    <rect x="618" y="410" width="319" height="12" rx="6" fill="#49454F"/>
    <rect id="loc_bar" x="618" y="410" width="263" height="12" rx="6" fill="#D0BCFF"/>

    <text x="618" y="450" id="loc_add" class="d-mono d-add-color" style="font-size: 11px;">++ 3,034,868</text>
    <text x="943" y="450" text-anchor="end" id="loc_del" class="d-mono d-del-color" style="font-size: 11px;">-- 529,661</text>

    <!-- Footer -->
    <rect x="24" y="504" width="937" height="52" rx="16" fill="#49454F"/>
    <text x="48" y="535" class="d-body-text" style="font-size: 12px; font-weight: 500;">github.com/kronix-k | Followers: <tspan id="follower_data">2</tspan></text>
    <text x="940" y="535" text-anchor="end" id="commit_data" class="d-mono" style="font-size: 12px; fill-opacity: 0.6;">Commits: 571</text>
</svg>
