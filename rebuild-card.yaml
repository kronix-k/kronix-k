name: Rebuild Profile Card (with GIFs)

# Run this manually (Actions tab -> Run workflow) the first time, and whenever
# you change content.md. It downloads all GIFs/icons, embeds them into the SVGs,
# then fills in the live GitHub numbers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Build card (embeds GIFs)
        run: python build_card.py

      - name: Fill in GitHub stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: kronix-k
        run: python today.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "chore: rebuild profile card" && git push)
