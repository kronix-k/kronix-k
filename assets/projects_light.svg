<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Projects: Neo Assistant, CLI Calculator, Temperature Converter, Warranty Manager" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Projects: Neo Assistant, CLI Calculator, Temperature Converter, Warranty Manager</title>
<style>

text{font-family:'Zen Kaku Gothic New','Segoe UI',Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;}
.disp{font-family:'Dela Gothic One','Arial Black','Impact','Segoe UI',sans-serif;font-weight:400;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<rect width="900" height="390" fill="#DCD5F2"/>
<text class="disp" x="24" y="30" font-size="27" fill="#D81B6A">Neo Assistant</text><rect x="24" y="28" width="120" height="25" fill="#F6D743"/><text x="84.0" y="46" text-anchor="middle" font-size="13.6" font-weight="700" fill="#1E1433">Main project</text><text x="340" y="22" font-size="17" font-weight="400" fill="#4D4366">An offline, multi-language voice assistant with</text><text x="340" y="50" font-size="17" font-weight="400" fill="#4D4366">interactive 3D visuals and lipsync. It runs on your</text><text x="340" y="78" font-size="17" font-weight="400" fill="#4D4366">device, so it keeps working without a connection.</text><rect x="24" y="105" width="852" height="1" fill="#1E1433"/><text x="24" y="150" font-size="20" font-weight="700" fill="#1E1433">CLI Calculator</text><text x="340" y="150" font-size="17" font-weight="400" fill="#4D4366">A terminal calculator for basic operations.</text><rect x="24" y="177" width="852" height="1" fill="#1E1433"/><text x="24" y="222" font-size="20" font-weight="700" fill="#1E1433">Temperature Converter</text><text x="340" y="222" font-size="17" font-weight="400" fill="#4D4366">Converts between temperature scales through a text</text><text x="340" y="250" font-size="17" font-weight="400" fill="#4D4366">interface.</text><rect x="24" y="277" width="852" height="1" fill="#1E1433"/><text x="24" y="322" font-size="20" font-weight="700" fill="#1E1433">Warranty Manager</text><text x="340" y="322" font-size="17" font-weight="400" fill="#4D4366">Keeps track of your product warranties and shows how</text><text x="340" y="350" font-size="17" font-weight="400" fill="#4D4366">to make a claim.</text><rect x="24" y="377" width="852" height="1" fill="#1E1433"/>
</svg>
