<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276" role="img" aria-label="GitHub stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>GitHub stats</title>
<style>

text{font-family:'Zen Kaku Gothic New','Segoe UI',Arial,'Segoe UI Emoji','Apple Color Emoji',sans-serif;}
.disp{font-family:'Dela Gothic One','Arial Black','Impact','Segoe UI',sans-serif;font-weight:400;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
<rect width="900" height="276" fill="#1A1230"/>
<rect x="24" y="24" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="40" y="54" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">STREAK</text><text id="streak_data" class="disp" x="40" y="94" font-size="32" fill="#EDE7FF">0</text><rect x="240" y="24" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="256" y="54" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">STARS</text><text id="star_data" class="disp" x="256" y="94" font-size="32" fill="#FF5C9E">0</text><rect x="456" y="24" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="472" y="54" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">REPOS</text><text id="repo_data" class="disp" x="472" y="94" font-size="32" fill="#EDE7FF">0</text><rect x="672" y="24" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="688" y="54" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">CONTRIBS</text><text id="contrib_data" class="disp" x="688" y="94" font-size="32" fill="#FF5C9E">0</text><rect x="24" y="132" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="40" y="162" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">COMMITS</text><text id="commit_data" class="disp" x="40" y="202" font-size="32" fill="#EDE7FF">0</text><rect x="240" y="132" width="204" height="96" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="256" y="162" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">FOLLOWERS</text><text id="follower_data" class="disp" x="256" y="202" font-size="32" fill="#FF5C9E">0</text><rect x="456" y="132" width="420" height="120" fill="#251A44" stroke="#EDE7FF" stroke-width="2"/><text x="472" y="162" font-size="12" font-weight="700" fill="#B5A9D6" letter-spacing="1">LINES OF CODE</text><text id="loc_data" class="disp" x="472" y="202" font-size="32" fill="#EDE7FF">0</text><rect x="472" y="214" width="388" height="8" fill="#1A1230"/><rect id="loc_bar" x="472" y="214" width="0" height="8" fill="#FF5C9E"/><text id="loc_add" x="472" y="242" font-size="12" font-weight="700" fill="#81C784">++ 0</text><text id="loc_del" x="860" y="242" text-anchor="end" font-size="12" font-weight="700" fill="#E57373">-- 0</text>
</svg>
